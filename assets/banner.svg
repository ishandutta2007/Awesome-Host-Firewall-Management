<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a12"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ef4444"/><stop offset="50%" stop-color="#f97316"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ef4444" stop-opacity=".8"/><stop offset="100%" stop-color="#f97316" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes flowRight{0%{transform:translateX(0);opacity:0}15%,85%{opacity:.9}}@keyframes pulseShield{0%{transform:scale(.98);opacity:.7}}@keyframes floatPill{0%{transform:translateY(0)}}.packet-fast{animation:flowRight 3s linear infinite}.packet-mid{animation:flowRight 4.5s linear infinite}.packet-slow{animation:flowRight 6s linear infinite}.shield-pulse{animation:pulseShield 3s ease-in-out infinite alternate}.grid-line{stroke:#1e293b;stroke-width:1;opacity:.4}.tag-pill{animation:floatPill 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)"/><g class="grid-line"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="350" x2="350" y1="0" y2="360"/><line x1="550" x2="550" y1="0